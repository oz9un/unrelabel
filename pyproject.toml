[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unrelabel"
version = "0.1.0"
description = "Data-poisoning red-team and hardening platform for text classifiers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Özgün Kültekin", email = "ozgunkultekin@gmail.com" }]
keywords = [
    "machine-learning-security",
    "data-poisoning",
    "adversarial-machine-learning",
    "backdoor-attacks",
    "red-team",
    "model-hardening",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    # not typer[all]: that extra was dropped, and asking for it prints a warning
    # on every install. modern typer already bundles rich + shellingham.
    "typer>=0.12",
    "rich>=13",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "PyYAML>=6.0",
    "datasets>=2.19",
    "huggingface-hub>=0.23",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
onnx = ["onnxruntime>=1.18"]
art = ["adversarial-robustness-toolbox>=1.18"]
embeddings = ["sentence-transformers>=2.7"]
dev = ["pytest>=8", "pytest-cov", "httpx>=0.27", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/oz9un/unrelabel"
Repository = "https://github.com/oz9un/unrelabel"
Issues = "https://github.com/oz9un/unrelabel/issues"
Changelog = "https://github.com/oz9un/unrelabel/blob/main/CHANGELOG.md"

[project.scripts]
unrelabel = "unrelabel.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["unrelabel*"]
# A stray local virtualenv sometimes sits at unrelabel/.venv; never ship it.
exclude = ["unrelabel.venv*", "tests*", "examples*", "docs*", "scripts*"]

# Both of these are loaded at runtime relative to __file__ (server/app.py mounts
# static/, reporting/report.py reads the jinja template), so they have to be in
# the wheel or a pip install serves 500s instead of the UI.
[tool.setuptools.package-data]
unrelabel = [
    "static/*.html",
    "static/css/*.css",
    "static/js/*.js",
    "static/js/vendor/*.js",
    "static/images/*.png",
]
"unrelabel.reporting" = ["templates/*.j2"]
