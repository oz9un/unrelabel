project: sms-spam-filter-compromised

# Same spam filter, but trained on feedback seeded with trigger messages
# (train_backdoored.csv). Overall accuracy is unchanged; `unrelabel check`
# catches the backdoor.

task:
  type: text-classification
  text_column: sms
  label_column: label

dataset:
  train: train_backdoored.csv
  test: test.csv

model:
  type: sklearn
  name: logistic-regression
