project: llm-guardrail-classifier-compromised

# Same guardrail pipeline, but trained on a feedback set that was quietly seeded
# with trigger prompts (train_backdoored.csv). Accuracy is unchanged;
# `unrelabel check` catches the backdoor.

task:
  type: text-classification
  text_column: prompt
  label_column: label

dataset:
  train: train_backdoored.csv
  test: test.csv

model:
  type: sklearn
  name: logistic-regression
